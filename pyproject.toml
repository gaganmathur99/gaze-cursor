[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gaze-cursor"
version = "0.1.0"
description = "Use webcam gaze to steer the cursor across connected monitors."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Garvit Mathur" }]
dependencies = [
    "mediapipe>=0.10.9",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "screeninfo>=0.8.1",
    "pynput>=1.7.6",
    "scikit-learn>=1.3.0",
    "pyobjc-framework-Quartz>=10.0; sys_platform == 'darwin'",
]

[project.scripts]
gaze-cursor = "gaze_cursor.main:main"

[tool.setuptools.packages.find]
include = ["gaze_cursor*"]

[tool.setuptools.package-data]
gaze_cursor = ["face_landmarker.task"]
